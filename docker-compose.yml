# Installation: siehe docs/INSTALLATION.md
#   cp .env.example .env   # Werte eintragen
#   docker compose up -d --build
#
# Zugang aus dem Internet über COMPOSE_PROFILES in .env wählen:
#   caddy       – eigener HTTPS-Proxy, Ports 80/443 müssen offen sein
#   cloudflare  – Cloudflare Tunnel, keine offenen Ports nötig
#   (leer)      – nur die App, z. B. für einen bereits vorhandenen Proxy oder cloudflared
services:
  app:
    build: .
    image: schichtplaner:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      SECURE_COOKIES: "${SECURE_COOKIES:-true}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BACKUP_DIR: /data/backups
      BACKUP_KEEP: "${BACKUP_KEEP:-14}"
    ports:
      # Port auf dem Server: in .env über APP_BIND ändern (z. B. 127.0.0.1:3001, wenn 3000 belegt ist).
      # Im Container bleibt es immer Port 3000.
      - "${APP_BIND:-127.0.0.1:3000}:3000"
    volumes:
      - data:/data
    networks:
      default:
        # unter diesem Namen erreichen andere Container (Caddy, cloudflared, …) die App: http://schichtplaner:3000
        aliases: [schichtplaner]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to schichtplaner:3000
    volumes:
      - caddy:/data
    logging:
      options: { max-size: "10m", max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    restart: unless-stopped
    depends_on: [app]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    logging:
      options: { max-size: "10m", max-file: "3" }

networks:
  default:
    # fester Name, damit ein bereits vorhandener cloudflared-/Proxy-Container beitreten kann
    name: schichtplaner

volumes:
  data:
  caddy:
